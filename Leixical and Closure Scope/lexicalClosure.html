// 1- closure ma ye smjh aya k jab ap function return krte ho to wo function return ni hota blke poora scope return hta ha or scope hi ni blke poora ka poora lexical scope return hota ha


    function makeFunc() {
  const name = "Mozilla";
  function displayName() {
    console.log(name);
  }
  return displayName; // is return ma just executions context ni balke poora ka poora lexical scoping ja raha ha uth kr 
}

const myFunc = makeFunc();

// some example about closure scoping.//

function Clickhandler(color){
 return function(){
    document.body.style.backgroundColor = `${color}` // hmre pas outer function ka inner function ma access ha or tbhi ye lexical scope ha agar access ni hota to ye lexical scope ni hota 
    // just function ni poora lexical scope uth k jata ... bahir.. to poora jo outer function ma lexical scope tha wo uth k bahir gya ha or is waja sa hmra code run ho chukka ha ... ye 
 }
}

document.getElementById('you').onclick = Clickhandler("red")
document.getElementById('here').onclick = Clickhandler("green")
